name: Continuous protocol soak (dedicated runner)
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Continuous duration in hours'
        required: true
        type: choice
        default: '24'
        options: ['24', '48', '72']
permissions:
  contents: read
concurrency:
  group: nyxlink-dedicated-protocol-soak
  cancel-in-progress: false
jobs:
  soak:
    # Never run pull-request code on this persistent runner.
    if: github.repository == 'SebasLoadJs/NyxLink' && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, linux, x64, nyxlink-soak]
    timeout-minutes: 4440
    env:
      NYXLINK_CONTAINER_ENGINE: docker
      SOAK_HOURS: ${{ inputs.hours }}
      NYXLINK_SOAK_RUN_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check dedicated runtime and duration
        run: |
          case "$SOAK_HOURS" in 24|48|72) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker info >/dev/null
          node scripts/test-soak.cjs --hours "$SOAK_HOURS" --check
      - run: pnpm install --frozen-lockfile
      - name: Run one continuous isolated protocol soak
        run: node scripts/test-soak.cjs --hours "$SOAK_HOURS" --armed
      - name: Independently verify completed evidence
        shell: bash
        run: |
          shopt -s nullglob
          reports=(.runtime/soak/"$NYXLINK_SOAK_RUN_KEY"/*.json)
          test "${#reports[@]}" -eq 1
          mkdir -p .runtime/soak-verification
          node scripts/check-endurance-evidence.cjs --soak "$SOAK_HOURS" "${reports[0]}" > .runtime/soak-verification/result.json
      - name: Upload only sanitized verification summary
        uses: actions/upload-artifact@v4
        with:
          name: protocol-soak-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/soak-verification/result.json
          if-no-files-found: error
          retention-days: 30
