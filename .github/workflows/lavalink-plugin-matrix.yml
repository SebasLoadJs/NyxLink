name: Lavalink expanded plugin matrix
on:
  push:
    branches: [dev]
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v*-dev.*'
    paths:
      - 'src/**'
      - 'index.ts'
      - 'tests/helpers/*plugin*.cjs'
      - 'tests/integration/lavalink-plugin-matrix.json'
      - 'scripts/test-lavalink-plugin-matrix.cjs'
      - '.github/workflows/lavalink-plugin-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [youtube, lavasrc, dunctebot, xm-mod-http, xm-mod-local, xm-native, java-lyrics, java-lavalyrics, lavasearch, lyrics-kt, google-tts, lavadspx]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/test-lavalink-plugin-matrix.cjs ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-matrix-${{ matrix.profile }}
          path: .runtime/plugin-matrix/
          if-no-files-found: warn
          retention-days: 14
