name: NodeLink proposal compatibility
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/nodelink-proposals.yml'
      - 'scripts/test-nodelink-proposal.cjs'
      - 'src/backends/NodeLink*'
      - 'src/entities/Track.ts'
      - 'src/entities/Node.ts'
      - 'src/entities/Rest.ts'
      - 'src/entities/Player.ts'
      - 'src/typings/Interfaces.ts'
      - 'index.ts'
permissions:
  contents: read
jobs:
  proposal:
    name: NodeLink PR ${{ matrix.proposal }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - proposal: '265'
            revision: d0c3f9348a28d2e3fbc5e7f689cae6e86fadad9a
          - proposal: '266'
            revision: 13c12ad1653436ed4ff96626d422f54ae65f4fca
          - proposal: '267'
            revision: e84a0a35958650d252461418123a5c82aef8395a
          - proposal: '268'
            revision: 2f62c8b4d873636cff58062597f943ef9579a5b7
          - proposal: '269'
            revision: 7df140312bf06214366b07c8a2a93acc93c76712
          - proposal: '270'
            revision: 017c6cc7ae341ba105849647711fc90d552b1d76
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SebasLoadJs/NodeLink
          ref: ${{ matrix.revision }}
          path: .runtime/nodelink-proposal
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Confirm exact fork revision
        working-directory: .runtime/nodelink-proposal
        env:
          EXPECTED_REVISION: ${{ matrix.revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Install and compile independent NodeLink checkout
        working-directory: .runtime/nodelink-proposal
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Verify actual proposal module output against SDK
        env:
          NYXLINK_NODELINK_PROPOSAL: ${{ matrix.proposal }}
          NYXLINK_NODELINK_PROPOSAL_ROOT: .runtime/nodelink-proposal
          NYXLINK_NODELINK_PROPOSAL_REVISION: ${{ matrix.revision }}
        run: node --test scripts/test-nodelink-proposal.cjs
