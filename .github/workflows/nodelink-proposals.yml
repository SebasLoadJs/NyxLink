name: NodeLink proposal compatibility
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/nodelink-proposals.yml'
      - 'scripts/test-nodelink-proposal.cjs'
      - 'src/backends/NodeLink*'
      - 'src/entities/Track.ts'
      - 'index.ts'
permissions:
  contents: read
jobs:
  proposal:
    name: NodeLink PR ${{ matrix.proposal }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - proposal: '265'
            revision: 39cae5066be93efe4ca9507b4b8f5cbb5a693210
          - proposal: '266'
            revision: 944cd7c3cdd5c38ca47b06a890e33e0e94c6c0f6
          - proposal: '267'
            revision: 4693b4a447647ea2d37773042489ee8f0cc63897
          - proposal: '268'
            revision: b3e1df8796755d1efcf05357c9c4898edd046693
          - proposal: '269'
            revision: 09c642906af98e0b724183bd329dae4666d7c48a
          - proposal: '270'
            revision: 72f4f8db58773b655dbe1e122de2a76e3c488152
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SebasLoadJs/NodeLink
          ref: ${{ matrix.revision }}
          path: .runtime/nodelink-proposal
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Confirm exact fork revision
        working-directory: .runtime/nodelink-proposal
        env:
          EXPECTED_REVISION: ${{ matrix.revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Install and compile independent NodeLink checkout
        working-directory: .runtime/nodelink-proposal
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Verify actual proposal module output against SDK
        env:
          NYXLINK_NODELINK_PROPOSAL: ${{ matrix.proposal }}
          NYXLINK_NODELINK_PROPOSAL_ROOT: .runtime/nodelink-proposal
          NYXLINK_NODELINK_PROPOSAL_REVISION: ${{ matrix.revision }}
        run: node --test scripts/test-nodelink-proposal.cjs
