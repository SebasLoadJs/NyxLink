name: Release tag integrity (publication disabled)

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v*-dev.*'

permissions:
  contents: read

jobs:
  package-gate:
    name: Validate immutable release tag without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag, version and npm dist-tag must match
        run: pnpm run release:check-tag
      - name: Inspect public npm version without rejecting already-published tag reruns
        run: node scripts/check-npm-registry.cjs --report-only
      - name: Strict public source types
        run: pnpm run typecheck:strict
      - name: Regression tests with coverage
        run: pnpm run test:coverage
      - name: Public TypeScript API
        run: pnpm run test:types
      - name: Pack and install isolated consumer
        run: pnpm run test:package
      - name: Exclude private files from npm tarball
        run: pnpm run pack:check
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Upload the exact validated npm archive (not published)
        uses: actions/upload-artifact@v4
        with:
          name: validated-release-distribution
          path: .runtime/validated-distribution/
          if-no-files-found: error
          retention-days: 30
