name: Validate NyxLink

on:
  push:
    branches: [dev, v5.2]
  pull_request:
    branches: [dev, v5.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Strict TypeScript debt audit (informational)
        if: matrix.node == 22
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run typecheck:strict 2>&1 | tee strict-types.log
      - name: Summarize strict diagnostics
        if: always() && matrix.node == 22
        run: |
          if [ -f strict-types.log ]; then
            echo "### Strict TypeScript diagnostics" >> "$GITHUB_STEP_SUMMARY"
            echo "Total: $(grep -c 'error TS' strict-types.log || true)" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            grep 'error TS' strict-types.log | sed -E 's/\([0-9]+,[0-9]+\).*//' | sort | uniq -c | sort -nr | head -40 >> "$GITHUB_STEP_SUMMARY" || true
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: pnpm run test:coverage
      - run: pnpm run test:types
      - run: pnpm run test:package
      - run: pnpm run pack:check
      - run: pnpm audit --prod --audit-level=high
