name: Validate NyxLink

on:
  push:
    branches: [dev, v5.2, v5.3]
  pull_request:
    branches: [dev, v5.2, v5.3]
  workflow_dispatch:

# Supersede only automatic development pushes; preserve manual, PR and release checks.
concurrency:
  group: pr-${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'dev-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript validation
        run: pnpm run typecheck
      - run: node --check scripts/test-live-voice.cjs
      - run: pnpm run test:coverage
      - run: pnpm run test:types
      - name: Generate candidate API reference for inspection
        run: |
          mkdir -p .runtime/generated-api
          node scripts/generate-api-reference.cjs --output .runtime/generated-api/api-generated.md
      - uses: actions/upload-artifact@v4
        with:
          name: generated-public-api-node-${{ matrix.node }}
          path: .runtime/generated-api/api-generated.md
          retention-days: 14
      - run: pnpm run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurora-acceptance-node-${{ matrix.node }}
          path: .runtime/aurora-acceptance/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - run: pnpm run pack:check
      - run: pnpm audit --prod --audit-level=high
      - name: Verify generated public API reference
        run: node scripts/generate-api-reference.cjs --check

  backend-integration:
    name: Backend integration (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NYXLINK_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test Lavalink and pinned baseline NodeLink
        run: pnpm run test:backends
      - name: Test Lavalink and pinned modern NodeLink
        env:
          NYXLINK_NODELINK_PROFILE: modern
        run: pnpm run test:backends
      - name: Test backend extensions
        run: pnpm run test:extensions
      - name: Endurance smoke test (30 seconds)
        run: pnpm run test:endurance -- 30

  lavalink-plugins:
    name: Lavalink plugin integration (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NYXLINK_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test pinned Lavalink plugins and runtime contracts
        run: pnpm run test:lavalink-plugins
