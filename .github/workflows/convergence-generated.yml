name: Generate convergence artifacts
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  generate:
    if: github.head_ref == 'integration/5.3-final-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve candidate lockfile (not release acceptance)
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Verify generated dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: node scripts/generate-api-reference.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: convergence-generated-files
          path: |
            pnpm-lock.yaml
            docs/api-generated.md
          retention-days: 7
      - name: Emit reproducible public metadata for repository review
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          for (const path of ['pnpm-lock.yaml','docs/api-generated.md']) {
            const bytes = fs.readFileSync(path);
            const encoded = bytes.toString('base64');
            console.log('GENERATED_META '+path+' '+bytes.length+' '+crypto.createHash('sha256').update(bytes).digest('hex'));
            for (let offset = 0; offset < encoded.length; offset += 512)
              console.log('GENERATED_CHUNK '+path+' '+offset+' '+encoded.slice(offset,offset+512));
          }
          NODE
