name: Package validation (publication disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run test:package
      - run: pnpm run pack:check
      - name: Check exact package version is unused in public npm registry (read-only)
        run: pnpm run release:check-registry
      - name: Upload the exact validated npm archive (not published)
        uses: actions/upload-artifact@v4
        with:
          name: validated-manual-distribution
          path: .runtime/validated-distribution/
          if-no-files-found: error
          retention-days: 30
