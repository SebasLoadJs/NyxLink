name: Prepare tested development distribution (no publication)
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Exact 40-character Git commit SHA from dev'
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate revision syntax
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate belongs to development history
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev
          git merge-base --is-ancestor "$REVISION" refs/remotes/origin/dev
          test -f scripts/pack-distribution.cjs
          test -f tests/release-workflow-gates.test.cjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:strict
      - run: pnpm run test:coverage
      - run: pnpm run test:types
      - run: pnpm run test:package
      - run: pnpm run pack:check
      - run: pnpm run release:check-registry
      - run: pnpm audit --prod --audit-level=high
      - run: node scripts/generate-api-reference.cjs --check
      - name: Verify archive checksum
        working-directory: .runtime/validated-distribution
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: validated-manual-distribution
          path: .runtime/validated-distribution/
          if-no-files-found: error
          retention-days: 30
