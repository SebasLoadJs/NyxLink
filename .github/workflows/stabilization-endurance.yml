name: Extended stabilization endurance

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/endurance.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/endurance.yml'
      - '.github/workflows/stabilization-endurance.yml'
  push:
    branches: [dev, v5.3]
    # Tag pushes bypass path filters in GitHub Actions: every immutable RC
    # and stable release must rerun the full 600-second backend endurance.
    tags:
      - 'v5.3.0-rc.*'
      - 'v5.3.0'
    paths:
      - 'package.json'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'docs/release-5.3-rc-runbook.md'
      - '.github/workflows/stabilization-endurance.yml'
  workflow_dispatch:

# Supersede only automatic development pushes; preserve manual, PR and release checks.
concurrency:
  group: stabilization-endurance-${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'dev-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  stabilization:
    uses: ./.github/workflows/endurance.yml
    with:
      seconds: '600'
