name: Aurora cross-platform PTY
on:
  push:
    branches: [v5.3]
  pull_request:
    branches: [dev, v5.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pty:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Install isolated native development test dependency
        run: npm ci --prefix tests/pty
      - run: node tests/pty/aurora-smoke.cjs
