name: Redis storage contract

on:
  push:
    branches: [dev, v5.3]
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v*-dev.*'
  pull_request:
    branches: [dev, v5.3]

# Supersede only automatic development pushes; preserve manual, PR and release checks.
concurrency:
  group: redis-storage-${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'dev-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  redis-storage:
    name: Redis 7 storage (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Test Redis-backed StorageAdapter against Redis 7
        run: node --test tests/integration/redis-storage.test.cjs tests/integration/redis-guild-lease.test.cjs tests/integration/redis-player-ownership.test.cjs tests/integration/redis-guild-ipc.test.cjs
