name: Local backend protocol integration

on:
  workflow_dispatch:
  push:
    branches: [dev, v5.2, v5.3]
  pull_request:
    branches: [dev, v5.2, v5.3]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/test-backends.cjs'
      - 'scripts/test-extensions.cjs'
      - 'scripts/test-lavalink-plugins.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend-integration.yml'

# Supersede only automatic development pushes; preserve manual, PR and release checks.
concurrency:
  group: backend-integration-${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'dev-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:backends
        env:
          NYXLINK_CONTAINER_ENGINE: docker
      - run: pnpm run test:extensions
        env:
          NYXLINK_CONTAINER_ENGINE: docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-protocol-evidence
          path: |
            .runtime/integration/latest-report.json
            .runtime/extensions/report.json
          include-hidden-files: true
          if-no-files-found: warn

  modern-nodelink:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NYXLINK_CONTAINER_ENGINE: docker
      NYXLINK_NODELINK_PROFILE: modern
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Modern NodeLink protocol regression
        run: node scripts/test-backends.cjs
      - name: Modern NodeLink extensions
        if: always()
        run: node scripts/test-nodelink-modern.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-nodelink-evidence
          path: |
            .runtime/integration/latest-report.json
            .runtime/extensions/modern-report.json
          include-hidden-files: true
          if-no-files-found: warn

  lavalink-plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      NYXLINK_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real Lavalink LavaLyrics and SponsorBlock integration
        run: pnpm run test:lavalink-plugins
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lavalink-real-plugin-evidence
          path: .runtime/lavalink-plugins/latest-report.json
          include-hidden-files: true
          if-no-files-found: warn
