<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 224" role="img" aria-labelledby="title desc"><title id="title">NyxLink Git timeline</title><desc id="desc">Selected verified release milestones, inherited tags and current development.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101226"/><stop offset="1" stop-color="#17152f"/></linearGradient><linearGradient id="accent"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect x="1" y="1" width="958" height="222" rx="18" fill="url(#bg)" stroke="#37355b"/><text x="30" y="36" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">GIT / RELEASE LINEAGE</text><text x="930" y="36" fill="#8ea3bf" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="end">NOVEMBER 2026</text><path d="M95 100H855" stroke="#494a75" stroke-width="3"/><path d="M95 100H855" stroke="url(#accent)" stroke-width="2" stroke-dasharray="5 12"><animate attributeName="stroke-dashoffset" from="34" to="0" dur="3s" repeatCount="indefinite"/></path><circle cx="95" cy="100" r="8" fill="#a78bfa" stroke="#15162c" stroke-width="3"/><text x="95" y="78" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Legacy tags</text><text x="95" y="134" fill="#eef0ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Inherited</text><text x="95" y="155" fill="#b3bddb" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Moonlink lineage</text><circle cx="285" cy="100" r="8" fill="#a78bfa" stroke="#15162c" stroke-width="3"/><text x="285" y="78" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">03 NOV</text><text x="285" y="134" fill="#eef0ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">0.1-dev</text><text x="285" y="155" fill="#b3bddb" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Development</text><circle cx="475" cy="100" r="8" fill="#a78bfa" stroke="#15162c" stroke-width="3"/><text x="475" y="78" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">24–25 NOV</text><text x="475" y="134" fill="#eef0ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">5.3 RC</text><text x="475" y="155" fill="#b3bddb" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Candidate tags</text><circle cx="665" cy="100" r="8" fill="#34d399" stroke="#15162c" stroke-width="3"/><text x="665" y="78" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">25 NOV</text><text x="665" y="134" fill="#eef0ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">5.3.0</text><text x="665" y="155" fill="#b3bddb" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Stable</text><circle cx="855" cy="100" r="8" fill="#a78bfa" stroke="#15162c" stroke-width="3"/><text x="855" y="78" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">26 NOV</text><text x="855" y="134" fill="#eef0ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">5.4-dev</text><text x="855" y="155" fill="#b3bddb" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Source only</text><text x="30" y="203" fill="#a8b2d6" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="start">Historical tags remain immutable · source development does not imply npm publication</text></svg>
